services:
  postgres:
    ports:
      - "5432:5432"  # 保持与主配置一致，避免混淆
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # 如果不需要，可删除

  redis:
    ports:
      - "6379:6379"  # 保持与主配置一致
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf  # 如果主配置已有，可省略
      - ./redis/data:/data

  backend:
    build: ./backend
    volumes:
      - ./backend/uploads:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-Ab123456}  # 统一密码

  frontend:
    build: ./frontend
    volumes:
      - ./backend/uploads:/usr/share/nginx/html/uploads