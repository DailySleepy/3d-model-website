services:
  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threed_model_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      - pgdata:/var/lib/postgresql/data

#新增redis（待上线测试）
  my-redis:
    image: redis:7.0-alpine
    container_name: my-redis
    restart: always
    # 容器内部使用的命令：直接在启动时传入密码，无需额外准备 redis.conf 文件（最省心做法）
    command: redis-server --requirepass Ab123456 --appendonly yes
    volumes:
      - ./redis/data:/data # 数据持久化目录映射
    # 注意：这里【不写】ports 映射（即不写 6379:6379），完全不对公网开放

  backend:
    image: backend:latest
    container_name: backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-postgres:5432/threed_model_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
      FILE_PATH: /data
    volumes:
      - uploads:/data

  frontend:
    image: frontend:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - uploads:/usr/share/nginx/html/uploads

volumes:
  pgdata:
  uploads: